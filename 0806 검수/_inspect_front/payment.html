<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://static.toss.im/tds/43.9.4/css/tds.min.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/main.css" />
    <link rel="stylesheet" type="text/css" href="https://static.toss.im/tps/others.css" />
    <script src="https://cdn.tossplace.com/toss-front-sdk/v0/index.js"></script>
    <script src="./sdk.js"></script>
    <script src="./api-config.js"></script>
    <title>결제 - Toss Front Plugin</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 이 화면(html)은 실제 단말기에서는 토스프론트 로컬 서버(예: 172.30.1.54:9900)에서 서빙되므로
      // fetch를 상대경로로 호출하면 백엔드가 아니라 그 로컬 주소로 요청이 나가버린다.
      // API 주소는 api-config.js에 빌드 시 주입한다. 백엔드가 직접 서빙하는 미리보기는 상대경로를 쓴다.
      const API_BASE = window.CHEVROLET_API_BASE_URL
      const PHONE_RE = /^01[0-9]{8,9}$/

      // NOTE: 이 매장은 POS 주문 시스템이 따로 없어 결제금액을 직원이 단말기에서 직접 입력한다.
      // 만약 나중에 주문/상품 시스템이 생기면 sdk.template.renderOrderPage 흐름(order.html 참고)으로 교체.
      function showAmountInput(errorText) {
        sdk.template.renderInputPage({
          type: 'number',
          top: {
            title: '결제 금액을 입력해주세요',
            subtitle: errorText || '원 단위',
          },
          input: { placeholder: '금액 입력' },
          button: { label: '결제 진행' },
          onSubmit: async (value) => {
            const amount = Number(value)
            if (!Number.isFinite(amount) || amount <= 0) {
              showAmountInput('결제 금액이 올바르지 않습니다.')
              return
            }
            await startPayment(amount)
          },
          onBack: () => {
            location.href = './index.html'
          },
        })
      }

      async function startPayment(amount) {
        const paymentKey = crypto.randomUUID()
        const tax = Math.floor(amount / 11)
        const supplyValue = amount - tax

        try {
          const result = await sdk.payment.requestPayment({
            paymentKey,
            tax,
            supplyValue,
            tip: 0,
            timeoutMs: 60000,
          })

          if (result.type === 'CANCELED' || result.type === 'TIMEOUT') {
            location.href = './index.html'
            return
          }

          if (result.type !== 'SUCCESS') {
            sdk.template.renderResultPage({
              type: 'image',
              status: 'error',
              title: '결제에 실패했습니다.',
              timerMs: 3000,
              onTimeout: () => showAmountInput(),
              localeCode: 'ko',
            })
            return
          }

          askPhoneForReceipt({ paymentKey, amount })
        } catch (err) {
          sdk.template.renderResultPage({
            type: 'image',
            status: 'error',
            title: '결제 처리 중 오류가 발생했습니다.',
            timerMs: 3000,
            onTimeout: () => showAmountInput(),
            localeCode: 'ko',
          })
        }
      }

      // 차량번호는 여기서 다시 입력받지 않는다. 전화번호만 받으면 서버가 그 번호로 등록된
      // 예약 기록(차량번호+정비항목)을 찾아 영수증에 그대로 넣어준다 (submitPayment 참고).
      function askPhoneForReceipt({ paymentKey, amount }, errorText) {
        sdk.template.renderInputPage({
          type: 'phone',
          top: {
            title: '전자영수증을 받으실\n전화번호를 입력해주세요',
            subtitle: errorText || '결제가 완료되었습니다',
          },
          input: { placeholder: '전화번호 입력' },
          button: { label: '영수증 받기' },
          onSubmit: async (value) => {
            const phone = value.replace(/-/g, '').trim()
            if (!PHONE_RE.test(phone)) {
              askPhoneForReceipt({ paymentKey, amount }, '전화번호 형식이 올바르지 않습니다.')
              return
            }
            await submitPayment({ paymentKey, amount, phone })
          },
          onBack: () => {
            location.href = './index.html'
          },
        })
      }

      async function submitPayment({ paymentKey, amount, phone }) {
        try {
          // App API(https://docs.tossplace.com/reference/plugin-sdk/front/app.html)의 비동기 함수.
          // 실제 단말기에서는 토스프론트가 그 단말기에 온보딩된 실제 가맹점 정보를 반환하고,
          // 로컬 브라우저 미리보기에서는 sdk.js가 채워둔 테스트 매장 정보가 반환된다.
          const merchant = await sdk.app.getMerchant()
          const merchantId = merchant?.id
          const res = await fetch(`${API_BASE}/api/payments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentKey, amount, phone, merchantId }),
          })
          const json = await res.json().catch(() => ({}))

          const matched = [json.carNumber, json.serviceType].filter(Boolean).join(' · ')

          sdk.template.renderResultPage({
            type: 'text',
            text: json.ok ? '영수증 발송 완료' : '영수증 발송 실패',
            title: '결제가 완료되었습니다',
            description: json.ok
              ? (matched ? `${matched} · 알림톡을 확인해주세요` : '알림톡을 확인해주세요')
              : '결제는 완료됐지만 영수증 발송에 실패했어요',
            timerMs: 5000,
            onTimeout: () => {
              location.href = './index.html'
            },
            localeCode: 'ko',
          })
        } catch (err) {
          sdk.template.renderResultPage({
            type: 'image',
            status: 'error',
            title: '영수증 처리 중 오류가 발생했습니다.',
            description: '결제는 이미 완료되었습니다.',
            timerMs: 4000,
            onTimeout: () => {
              location.href = './index.html'
            },
            localeCode: 'ko',
          })
        }
      }

      showAmountInput()
    </script>
  </body>
</html>
