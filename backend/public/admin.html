<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>쉐보레 포스모스 · 관리자</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --blue: #3182f6;
    --blue-dark: #1b64da;
    --blue-tint: #eef4ff;
    --ink: #191f28;
    --muted: #8b95a1;
    --border: #e5e8eb;
    --surface: #f2f4f6;
    --error: #f04452;
    --green: #12b76a;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--surface);
    color: var(--ink);
  }
  .top {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .top h1 {
    font-size: 17px;
    font-weight: 700;
    margin: 0;
  }
  .top .actions { display: flex; gap: 8px; align-items: center; }
  .top button, .top .status {
    font-size: 13px;
  }
  #login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #login-card {
    width: 100%;
    max-width: 360px;
    background: #fff;
    border-radius: 20px;
    padding: 32px 24px;
  }
  #login-card h1 {
    font-size: 19px;
    margin: 0 0 4px;
  }
  #login-card p {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 20px;
  }
  input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    background: var(--surface);
    border: 1.5px solid transparent;
    border-radius: 12px;
    outline: none;
    margin-bottom: 10px;
  }
  input[type="password"]:focus { border-color: var(--blue); background: #fff; }
  button {
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: var(--blue);
    color: #fff;
  }
  button:hover { background: var(--blue-dark); }
  button.ghost {
    background: transparent;
    color: var(--muted);
    font-weight: 600;
    border: 1px solid var(--border);
  }
  button.ghost:hover { background: var(--surface); color: var(--ink); }
  button:disabled { background: var(--border); color: #b0b8c1; cursor: not-allowed; }
  .err { color: var(--error); font-size: 13px; min-height: 18px; margin: 0 0 6px; }
  main { max-width: 900px; margin: 0 auto; padding: 20px; display: none; }
  .callnext {
    background: #fff;
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .callnext div { font-size: 14px; color: var(--muted); }
  .callnext button { white-space: nowrap; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    background: #fff;
    color: var(--muted);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .section { background: #fff; border-radius: 16px; padding: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge.waiting { background: var(--blue-tint); color: var(--blue); }
  .badge.called, .badge.receipt_sent { background: #e7f9f1; color: var(--green); }
  .badge.notify_failed, .badge.receipt_failed { background: #fdeeef; color: var(--error); }
  .badge.completed { background: var(--surface); color: var(--ink); }
  .badge.requested { background: var(--surface); color: var(--muted); }
  .empty { padding: 40px 12px; text-align: center; color: var(--muted); font-size: 14px; }
  .row-actions { display: flex; gap: 6px; }
  .row-btn {
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .row-btn.call { color: var(--blue); border-color: var(--blue-tint); background: var(--blue-tint); }
  .row-btn.complete { color: var(--green); border-color: #e7f9f1; background: #e7f9f1; }
  .row-btn.call:disabled, .row-btn.complete:disabled { color: #b0b8c1; border-color: var(--border); background: var(--surface); cursor: not-allowed; }
  .row-btn.del { color: var(--error); }
  .row-btn:hover:not(:disabled) { filter: brightness(0.96); }
  .refresh-note { font-size: 12px; color: var(--muted); margin: 10px 2px 0; }
  .testform {
    background: #fff;
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .testform summary {
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    color: var(--muted);
  }
  .testform-body { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .testform-body input, .testform-body select {
    flex: 1;
    min-width: 140px;
    padding: 10px 12px;
    font-size: 14px;
    background: var(--surface);
    border: 1.5px solid transparent;
    border-radius: 10px;
    outline: none;
    color: var(--ink);
    font-family: inherit;
  }
  .testform-body input:focus, .testform-body select:focus { border-color: var(--blue); background: #fff; }
  .testform-body button { flex: 0 0 auto; padding: 10px 18px; font-size: 14px; }
  .testform-msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .testform-msg.ok { color: var(--green); }
  .testform-msg.err { color: var(--error); }
</style>
</head>
<body>

<div id="login-wrap">
  <div id="login-card">
    <h1>관리자 로그인</h1>
    <p>이메일/비밀번호로 로그인하세요.</p>
    <input type="email" id="email-input" placeholder="이메일" autocomplete="username" style="width:100%;padding:14px 16px;font-size:16px;background:var(--surface);border:1.5px solid transparent;border-radius:12px;outline:none;margin-bottom:10px;box-sizing:border-box;" />
    <input type="password" id="password-input" placeholder="비밀번호" autocomplete="current-password" />
    <div class="err" id="login-err"></div>
    <button id="login-btn" style="width:100%">로그인</button>
  </div>
</div>

<div class="top" id="top-bar" style="display:none">
  <h1>쉐보레 포스모스 · 관리자</h1>
  <div class="actions">
    <select id="store-select" style="max-width:160px"></select>
    <span class="status" id="conn-status"></span>
    <button class="ghost" id="logout-btn">로그아웃</button>
  </div>
</div>

<main id="main">
  <details class="testform" id="store-add">
    <summary>가맹점 관리 (본사) — 매장 등록</summary>
    <div class="testform-body">
      <input type="text" id="store-merchant-id" placeholder="merchantId (토스 SDK merchant.id)" />
      <input type="text" id="store-name" placeholder="매장명" />
      <input type="text" id="store-biz" placeholder="사업자번호 (선택)" />
      <button id="store-add-btn">매장 등록</button>
    </div>
    <div class="testform-msg" id="store-add-msg"></div>
  </details>

  <details class="testform" id="store-admin-add">
    <summary>가맹점 관리 (본사) — 매장 관리자 계정 발급</summary>
    <div class="testform-body">
      <input type="text" id="sa-merchant-id" placeholder="merchantId (등록된 매장)" />
      <input type="email" id="sa-email" placeholder="이메일" />
      <input type="password" id="sa-password" placeholder="비밀번호 (8자 이상)" />
      <button id="sa-add-btn">계정 발급</button>
    </div>
    <div class="testform-msg" id="sa-add-msg"></div>
  </details>

  <div class="callnext">
    <div id="callnext-info">대기중인 다음 손님을 호출하고 순서 알림을 보냅니다.</div>
    <button id="callnext-btn">다음 손님 호출</button>
  </div>

  <details class="testform">
    <summary>테스트 예약 생성 (실제 손님 예약과 동일하게 접수 알림이 발송됩니다)</summary>
    <div class="testform-body">
      <input type="text" id="test-car" placeholder="차량번호 (예: 12가3456)" maxlength="8" />
      <select id="test-service"></select>
      <input type="text" id="test-phone" placeholder="전화번호 (예: 01012345678)" maxlength="11" />
      <button id="test-submit-btn">테스트 예약 등록</button>
    </div>
    <div class="testform-msg" id="test-msg"></div>
  </details>

  <div class="tabs">
    <div class="tab active" data-tab="reservations">예약 (<span id="count-res">0</span>)</div>
    <div class="tab" data-tab="payments">결제 (<span id="count-pay">0</span>)</div>
  </div>

  <div class="section">
    <div id="reservations-view"></div>
    <div id="payments-view" style="display:none"></div>
  </div>
  <div class="refresh-note">15초마다 자동 새로고침됩니다.</div>
</main>

<script>
const STATUS_LABEL = {
  waiting: '대기중',
  called: '호출완료',
  notify_failed: '알림실패',
  completed: '정비완료',
  requested: '결제접수',
  receipt_sent: '영수증발송',
  receipt_failed: '영수증실패',
}

// server.js의 SERVICE_TYPES와 키를 맞춰야 한다.
const SERVICE_TYPES = [
  { value: 'oil', title: '엔진오일 교체' },
  { value: 'inspection', title: '정기점검' },
  { value: 'tire', title: '타이어 교체·펑크수리' },
  { value: 'battery', title: '배터리 교체' },
  { value: 'brake', title: '브레이크 정비' },
  { value: 'etc', title: '기타 수리·상담' },
]

let token = sessionStorage.getItem('admin_token') || ''
let adminRole = sessionStorage.getItem('admin_role') || ''
let adminStoreId = sessionStorage.getItem('admin_store_id') || ''
let myMerchantId = '' // store_admin 로그인 시 /api/admin/me로 채워짐 (테스트 예약용)
let currentTab = 'reservations'
let pollTimer = null
let stores = []
let currentStoreId = '' // '' = 전체 매장(본사 뷰). store_admin은 항상 자기 storeId로 고정된다.

const loginWrap = document.getElementById('login-wrap')
const topBar = document.getElementById('top-bar')
const main = document.getElementById('main')
const emailInput = document.getElementById('email-input')
const passwordInput = document.getElementById('password-input')
const loginBtn = document.getElementById('login-btn')
const loginErr = document.getElementById('login-err')
const logoutBtn = document.getElementById('logout-btn')
const connStatus = document.getElementById('conn-status')
const callnextBtn = document.getElementById('callnext-btn')
const callnextInfo = document.getElementById('callnext-info')
const testCarInput = document.getElementById('test-car')
const testServiceSelect = document.getElementById('test-service')
const testPhoneInput = document.getElementById('test-phone')
const testSubmitBtn = document.getElementById('test-submit-btn')
const testMsg = document.getElementById('test-msg')
const storeSelect = document.getElementById('store-select')
const storeMerchantIdInput = document.getElementById('store-merchant-id')
const storeNameInput = document.getElementById('store-name')
const storeBizInput = document.getElementById('store-biz')
const storeAddBtn = document.getElementById('store-add-btn')
const storeAddMsg = document.getElementById('store-add-msg')
const storeAddPanel = document.getElementById('store-add')
const storeAdminAddPanel = document.getElementById('store-admin-add')
const saMerchantIdInput = document.getElementById('sa-merchant-id')
const saEmailInput = document.getElementById('sa-email')
const saPasswordInput = document.getElementById('sa-password')
const saAddBtn = document.getElementById('sa-add-btn')
const saAddMsg = document.getElementById('sa-add-msg')

testServiceSelect.innerHTML = SERVICE_TYPES.map((s) => `<option value="${s.value}">${s.title}</option>`).join('')

function fmtDate(iso) {
  if (!iso) return '-'
  const d = new Date(iso)
  return d.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
}

function fmtAmount(n) {
  if (n === null || n === undefined) return '-'
  return Number(n).toLocaleString('ko-KR') + '원'
}

async function api(path) {
  const res = await fetch(path, { headers: { authorization: 'Bearer ' + token } })
  if (res.status === 401) throw new Error('UNAUTHORIZED')
  if (!res.ok) throw new Error('요청 실패 (' + res.status + ')')
  return res.json()
}

async function apiPost(path, method = 'POST') {
  const res = await fetch(path, { method, headers: { authorization: 'Bearer ' + token } })
  const body = await res.json().catch(() => ({}))
  if (res.status === 401) throw new Error('UNAUTHORIZED')
  return { ok: res.ok, status: res.status, body }
}

async function showApp() {
  loginWrap.style.display = 'none'
  topBar.style.display = 'flex'
  main.style.display = 'block'

  const isHq = adminRole === 'hq_admin'
  storeAddPanel.style.display = isHq ? '' : 'none'
  storeAdminAddPanel.style.display = isHq ? '' : 'none'

  if (isHq) {
    await loadStores()
  } else {
    // store_admin: 매장 선택 UI 자체가 필요 없다 — 항상 자기 매장으로 고정.
    currentStoreId = adminStoreId
    storeSelect.style.display = 'none'
    const me = await api('/api/admin/me')
    myMerchantId = me.store?.merchantId || ''
  }

  await loadAll()
  if (pollTimer) clearInterval(pollTimer)
  pollTimer = setInterval(loadAll, 15000)
}

async function loadStores() {
  try {
    const data = await api('/api/admin/stores')
    stores = data.stores || []
  } catch (e) {
    stores = []
  }
  renderStoreSelect()
}

function renderStoreSelect() {
  const options = ['<option value="">전체 매장</option>']
    .concat(stores.map((s) => `<option value="${s.id}">${escapeHtml(s.name)}</option>`))
  storeSelect.innerHTML = options.join('')
  storeSelect.value = currentStoreId
}

storeSelect.addEventListener('change', () => {
  currentStoreId = storeSelect.value
  loadAll()
})

storeAddBtn.addEventListener('click', async () => {
  const merchantId = storeMerchantIdInput.value.trim()
  const name = storeNameInput.value.trim()
  const businessNumber = storeBizInput.value.trim()
  storeAddMsg.textContent = ''
  storeAddMsg.className = 'testform-msg'
  if (!merchantId || !name) {
    storeAddMsg.textContent = 'merchantId와 매장명은 필수입니다.'
    storeAddMsg.className = 'testform-msg err'
    return
  }
  storeAddBtn.disabled = true
  try {
    const res = await fetch('/api/admin/stores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', authorization: 'Bearer ' + token },
      body: JSON.stringify({ merchantId, name, businessNumber }),
    })
    const body = await res.json().catch(() => ({}))
    if (!res.ok || !body.ok) {
      storeAddMsg.textContent = body.error || '등록 실패'
      storeAddMsg.className = 'testform-msg err'
      return
    }
    storeAddMsg.textContent = `등록 완료: ${body.store.name}`
    storeAddMsg.className = 'testform-msg ok'
    storeMerchantIdInput.value = ''
    storeNameInput.value = ''
    storeBizInput.value = ''
    await loadStores()
  } catch (e) {
    storeAddMsg.textContent = '요청 중 오류가 발생했습니다.'
    storeAddMsg.className = 'testform-msg err'
  } finally {
    storeAddBtn.disabled = false
  }
})

function showLogin(message) {
  loginWrap.style.display = 'flex'
  topBar.style.display = 'none'
  main.style.display = 'none'
  if (pollTimer) clearInterval(pollTimer)
  if (message) loginErr.textContent = message
}

function persistSession() {
  sessionStorage.setItem('admin_token', token)
  sessionStorage.setItem('admin_role', adminRole)
  sessionStorage.setItem('admin_store_id', adminStoreId || '')
}

function clearSession() {
  sessionStorage.removeItem('admin_token')
  sessionStorage.removeItem('admin_role')
  sessionStorage.removeItem('admin_store_id')
  token = ''
  adminRole = ''
  adminStoreId = ''
}

async function loginWithCredentials(email, password) {
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    })
    const body = await res.json().catch(() => ({}))
    if (!res.ok || !body.ok) {
      clearSession()
      showLogin(body.error || '로그인에 실패했습니다.')
      return
    }
    token = body.token
    adminRole = body.role
    adminStoreId = body.storeId || ''
    persistSession()
    loginErr.textContent = ''
    showApp()
  } catch (e) {
    clearSession()
    showLogin('로그인 중 오류가 발생했습니다.')
  }
}

async function tryResumeSession() {
  try {
    await api('/api/admin/me')
    showApp()
  } catch (e) {
    clearSession()
    showLogin('세션이 만료되었습니다. 다시 로그인해주세요.')
  }
}

loginBtn.addEventListener('click', () => {
  const email = emailInput.value.trim()
  const password = passwordInput.value
  if (!email || !password) return
  loginWithCredentials(email, password)
})
passwordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loginBtn.click()
})
logoutBtn.addEventListener('click', () => {
  clearSession()
  showLogin('')
})

saAddBtn.addEventListener('click', async () => {
  const merchantId = saMerchantIdInput.value.trim()
  const email = saEmailInput.value.trim()
  const password = saPasswordInput.value
  saAddMsg.textContent = ''
  saAddMsg.className = 'testform-msg'
  if (!merchantId || !email || !password) {
    saAddMsg.textContent = 'merchantId/이메일/비밀번호는 필수입니다.'
    saAddMsg.className = 'testform-msg err'
    return
  }
  saAddBtn.disabled = true
  try {
    const res = await fetch('/api/admin/store-admins', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', authorization: 'Bearer ' + token },
      body: JSON.stringify({ merchantId, email, password }),
    })
    const body = await res.json().catch(() => ({}))
    if (!res.ok || !body.ok) {
      saAddMsg.textContent = body.error || '발급 실패'
      saAddMsg.className = 'testform-msg err'
      return
    }
    saAddMsg.textContent = `발급 완료: ${body.admin.email}`
    saAddMsg.className = 'testform-msg ok'
    saMerchantIdInput.value = ''
    saEmailInput.value = ''
    saPasswordInput.value = ''
  } catch (e) {
    saAddMsg.textContent = '요청 중 오류가 발생했습니다.'
    saAddMsg.className = 'testform-msg err'
  } finally {
    saAddBtn.disabled = false
  }
})

document.querySelectorAll('.tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'))
    tab.classList.add('active')
    currentTab = tab.dataset.tab
    document.getElementById('reservations-view').style.display = currentTab === 'reservations' ? 'block' : 'none'
    document.getElementById('payments-view').style.display = currentTab === 'payments' ? 'block' : 'none'
  })
})

document.getElementById('reservations-view').addEventListener('click', async (e) => {
  const btn = e.target.closest('.row-btn')
  if (!btn || btn.disabled) return
  const id = btn.dataset.id

  if (btn.classList.contains('call')) {
    btn.disabled = true
    btn.textContent = '호출중...'
    try {
      const { ok, body } = await apiPost(`/api/reservations/${id}/call`)
      if (!ok) alert(body.error || '호출에 실패했습니다.')
    } catch (err) {
      if (err.message === 'UNAUTHORIZED') {
        clearSession()
        showLogin('세션이 만료되었습니다. 다시 로그인해주세요.')
        return
      }
      alert('호출 중 오류가 발생했습니다.')
    }
    await loadAll()
    return
  }

  if (btn.classList.contains('complete')) {
    btn.disabled = true
    btn.textContent = '처리중...'
    try {
      const { ok, body } = await apiPost(`/api/reservations/${id}/complete`)
      if (!ok) alert(body.error || '처리에 실패했습니다.')
    } catch (err) {
      if (err.message === 'UNAUTHORIZED') {
        clearSession()
        showLogin('세션이 만료되었습니다. 다시 로그인해주세요.')
        return
      }
      alert('처리 중 오류가 발생했습니다.')
    }
    await loadAll()
    return
  }

  if (btn.classList.contains('del')) {
    if (!confirm('이 예약을 삭제할까요?')) return
    btn.disabled = true
    try {
      const { ok, body } = await apiPost(`/api/reservations/${id}`, 'DELETE')
      if (!ok) alert(body.error || '삭제에 실패했습니다.')
    } catch (err) {
      if (err.message === 'UNAUTHORIZED') {
        clearSession()
        showLogin('세션이 만료되었습니다. 다시 로그인해주세요.')
        return
      }
      alert('삭제 중 오류가 발생했습니다.')
    }
    await loadAll()
  }
})

function renderReservations(list) {
  const view = document.getElementById('reservations-view')
  document.getElementById('count-res').textContent = list.length
  if (!list.length) {
    view.innerHTML = '<div class="empty">예약 내역이 없습니다.</div>'
    return
  }
  const rows = list.map((r) => `
    <tr>
      <td>#${r.queueNumber}</td>
      <td>${escapeHtml(r.carNumber)}</td>
      <td>${escapeHtml(r.serviceType || '-')}</td>
      <td>${escapeHtml(r.phone)}</td>
      <td><span class="badge ${r.status}">${STATUS_LABEL[r.status] || r.status}</span></td>
      <td>${fmtDate(r.createdAt)}</td>
      <td class="row-actions">
        <button class="row-btn call" data-id="${r.id}" ${r.status !== 'waiting' ? 'disabled' : ''}>호출</button>
        <button class="row-btn complete" data-id="${r.id}" ${r.status !== 'called' && r.status !== 'notify_failed' ? 'disabled' : ''}>완료</button>
        <button class="row-btn del" data-id="${r.id}">삭제</button>
      </td>
    </tr>
  `).join('')
  view.innerHTML = `<table>
    <thead><tr><th>순번</th><th>차량번호</th><th>정비항목</th><th>전화번호</th><th>상태</th><th>접수시간</th><th>동작</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`
}

function renderPayments(list) {
  const view = document.getElementById('payments-view')
  document.getElementById('count-pay').textContent = list.length
  if (!list.length) {
    view.innerHTML = '<div class="empty">결제 내역이 없습니다.</div>'
    return
  }
  const rows = list.map((p) => `
    <tr>
      <td>${escapeHtml(p.carNumber || '-')}</td>
      <td>${escapeHtml(p.serviceType || '-')}</td>
      <td>${escapeHtml(p.phone)}</td>
      <td>${fmtAmount(p.amount)}</td>
      <td><span class="badge ${p.status}">${STATUS_LABEL[p.status] || p.status}</span></td>
      <td>${p.promoSent ? '발송완료' : fmtDate(p.promoAt)}</td>
      <td>${fmtDate(p.createdAt)}</td>
    </tr>
  `).join('')
  view.innerHTML = `<table>
    <thead><tr><th>차량번호</th><th>정비항목</th><th>전화번호</th><th>결제금액</th><th>상태</th><th>프로모션</th><th>결제시간</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}

async function loadAll() {
  try {
    const qs = currentStoreId ? `?storeId=${encodeURIComponent(currentStoreId)}` : ''
    const [resData, payData] = await Promise.all([api('/api/reservations' + qs), api('/api/payments' + qs)])
    renderReservations(resData.reservations)
    renderPayments(payData.payments)
    connStatus.textContent = ''
    updateCallnextInfo(resData.reservations)
  } catch (e) {
    if (e.message === 'UNAUTHORIZED') {
      clearSession()
      showLogin('세션이 만료되었거나 권한이 없습니다. 다시 로그인해주세요.')
    } else {
      connStatus.textContent = '연결 오류'
    }
  }
}

function updateCallnextInfo(reservations) {
  if (!currentStoreId) {
    callnextInfo.textContent = '매장을 선택하면 다음 손님을 호출할 수 있습니다.'
    callnextBtn.disabled = true
    return
  }
  const waiting = reservations.filter((r) => r.status === 'waiting')
  callnextInfo.textContent = waiting.length
    ? `대기중 ${waiting.length}건 · 다음 순번 #${[...waiting].sort((a, b) => a.queueNumber - b.queueNumber)[0].queueNumber}`
    : '대기중인 예약이 없습니다.'
  callnextBtn.disabled = waiting.length === 0
}

callnextBtn.addEventListener('click', async () => {
  if (!currentStoreId) return
  callnextBtn.disabled = true
  callnextBtn.textContent = '호출 중...'
  try {
    const { ok, body } = await apiPost(`/api/queue/call-next?storeId=${encodeURIComponent(currentStoreId)}`)
    if (!ok) {
      alert(body.error || '호출에 실패했습니다.')
    }
    await loadAll()
  } catch (e) {
    if (e.message === 'UNAUTHORIZED') {
      clearSession()
      showLogin('세션이 만료되었거나 권한이 없습니다. 다시 로그인해주세요.')
    } else {
      alert('호출 중 오류가 발생했습니다.')
    }
  } finally {
    callnextBtn.textContent = '다음 손님 호출'
  }
})

testSubmitBtn.addEventListener('click', async () => {
  const carNumber = testCarInput.value.trim()
  const serviceType = testServiceSelect.value
  const phone = testPhoneInput.value.trim()
  testMsg.textContent = ''
  testMsg.className = 'testform-msg'

  // hq_admin은 상단 드롭다운에서 선택한 매장, store_admin은 로그인 시 조회해둔 자기 매장(myMerchantId) 사용.
  const merchantId = adminRole === 'store_admin' ? myMerchantId : stores.find((s) => s.id === currentStoreId)?.merchantId
  if (!merchantId) {
    testMsg.textContent = '상단에서 매장을 먼저 선택해주세요 ("전체 매장"으로는 테스트 예약을 만들 수 없습니다).'
    testMsg.className = 'testform-msg err'
    return
  }

  testSubmitBtn.disabled = true
  try {
    const res = await fetch('/api/reservations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ carNumber, phone, serviceType, merchantId }),
    })
    const body = await res.json().catch(() => ({}))
    if (!res.ok || !body.ok) {
      testMsg.textContent = body.error || '등록 실패'
      testMsg.className = 'testform-msg err'
      return
    }
    testMsg.textContent = `등록 완료 (#${body.queueNumber} · ${body.serviceType}) · 앞으로 ${body.peopleAhead}명 남았다는 접수 알림이 발송됩니다. 호출은 POS/관리자 화면에서 직접 눌러주세요.`
    testMsg.className = 'testform-msg ok'
    testCarInput.value = ''
    testPhoneInput.value = ''
    await loadAll()
  } catch (e) {
    testMsg.textContent = '요청 중 오류가 발생했습니다.'
    testMsg.className = 'testform-msg err'
  } finally {
    testSubmitBtn.disabled = false
  }
})

if (token) {
  tryResumeSession()
} else {
  showLogin('')
}
</script>
</body>
</html>
